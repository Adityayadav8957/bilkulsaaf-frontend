<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7" stitchTiles="stitch" result="fiber" />
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="grain" />
    <feColorMatrix in="fiber" type="matrix"
      values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.30 0" result="fiberTint" />
    <feColorMatrix in="grain" type="matrix"
      values="0 0 0 0 0.35  0 0 0 0 0.35  0 0 0 0 0.35  0 0 0 0.12 0" result="grainTint" />
    <feMerge>
      <feMergeNode in="fiberTint" />
      <feMergeNode in="grainTint" />
    </feMerge>
  </filter>
  <rect width="260" height="260" filter="url(#paper)" />
</svg>
